appId: com.schoolmgmt.app
productName: School Management System
directories:
  output: dist
files:
  - out/**/*
  - resources/**/*
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
extraResources:
  - from: resources
    to: resources
